[package]
name = "roles-policy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RolesPolicy: a function- and argument-scoped Policy for OpenZeppelin Stellar smart accounts, with asymmetric Exit/Entry signature thresholds."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-accounts = { workspace = true }
roles-config = { path = "../../crates/roles-config" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
