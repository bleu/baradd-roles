# Illustrative only — CEXAMPLEVAULT/GOPERATOR* are placeholders, not real
# deployed addresses. See docs/spec.md, "Week 1", item 3: the exact function
# names and arguments still need verifying against a real protocol's testnet
# transaction before this is used for anything but a CLI demo.

[account]
address = "CCHESTACCOUNT"

[[rule]]
name = "exit-vault"
mode = "exit"
threshold = 1
signers = ["GOPERATOR1", "GOPERATOR2"]

  [[rule.target]]
  contract = "CEXAMPLEVAULT"
  label = "Example vault"

    [[rule.target.fn]]
    name = "withdraw"

      [[rule.target.fn.cond]]
      op = "eq_self"
      arg = 0
