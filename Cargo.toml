[workspace]
resolver = "2"
members = [
    "crates/roles-config",
    "contracts/roles-policy",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/bleu/barad-stellar-wallet"

[workspace.dependencies]
soroban-sdk = "28.0.0"
stellar-accounts = "0.8.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
